# Al Hadeed Hardware — the API, as a Render Blueprint.
#
# Render reads this file and provisions the service, so the dashboard
# steps are reduced to: New -> Blueprint -> pick this repository ->
# fill in the values it asks for -> Apply.
#
# Everything here is on free tiers. Nothing in this file costs money:
# no paid instance, no disk, no add-on. SMS sends nothing until you put
# real gateway credentials in (see SMS_PROVIDER at the bottom).
#
# ─────────────────────────────────────────────────────────────────────
#  READ THIS BEFORE TAKING REAL ORDERS
#
#  A free Render service has no persistent disk, and the API keeps its
#  data in a SQLite file. That file lives only as long as the running
#  container, so it is wiped:
#
#    • on every deploy (including every push to main)
#    • on every restart
#    • when the service wakes after sleeping (free services sleep after
#      roughly 15 minutes with no traffic, and wake into a fresh
#      container)
#
#  So orders, receipts, the cash book and the staff accounts all
#  disappear, regularly and without warning. That is fine for a demo,
#  for showing the client, and for testing the whole flow end to end.
#  It is not fine for a shop taking real money.
#
#  The free way to fix it is a hosted Postgres — Supabase and Neon both
#  have a free tier, and the concept paper proposes Supabase anyway. The
#  API would need its database layer ported from node:sqlite; all the
#  SQL lives in backend/src/db/. See docs/DEPLOYMENT.md.
#
#  The quick way to fix it is a paid Render instance with a 1 GB disk
#  mounted at /data and DB_FILE=/data/alhadeed.db. That is the block
#  this file used to carry, and it is the only thing that was costing
#  anything.
# ─────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: alhadeed-api
    runtime: node
    plan: free
    region: frankfurt # the closest Render region to Uganda
    rootDir: backend
    buildCommand: npm install
    # Bootstrap first: it creates the tables on an empty database and
    # exits non-zero rather than starting a shop nobody can sign in to.
    # On free hosting it runs in earnest on every wake, because the
    # database is empty again each time.
    startCommand: npm run db:bootstrap && npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ─── Runtime ──────────────────────────────────────────────────
      # The API uses the built-in node:sqlite module, which does not
      # exist before Node 22.5. Without this the deploy fails with
      # "Cannot find module 'node:sqlite'".
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      # Inside the container, since there is no disk to mount.
      - key: DB_FILE
        value: ./data/alhadeed.db

      # ─── Security ─────────────────────────────────────────────────
      # Render generates this once and keeps it. Never commit a real
      # one: anyone holding it can mint a valid login for any account.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h

      # Left true, every login code is 123456 for anyone who knows a
      # registered number.
      - key: OTP_DEV_MODE
        value: "false"

      # ─── The shop ─────────────────────────────────────────────────
      - key: SHOP_NAME
        value: Al Hadeed Hardware
      - key: CURRENCY
        value: UGX

      # ─── Who can call the API ─────────────────────────────────────
      # The Vercel domain, e.g. https://alhaheed-hardware.vercel.app —
      # comma-separated for more than one. Until it is right, the
      # browser blocks every request from the panel.
      - key: CORS_ORIGINS
        sync: false

      # ─── The first manager ────────────────────────────────────────
      # Used on an empty database to create the account that adds the
      # real staff and products. On free hosting the database empties
      # itself, so leave these set — they are how the service recovers.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ─── SMS ──────────────────────────────────────────────────────
      # "log" writes the message to the service log and sends nothing,
      # so it costs nothing: fine for testing, useless to a customer
      # waiting for a code. Switch to africastalking and add the three
      # values below when you are ready to pay per message.
      - key: SMS_PROVIDER
        value: log
      - key: SMS_USERNAME
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
