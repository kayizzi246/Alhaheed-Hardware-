# Al Hadeed Hardware — the API, as a Render Blueprint.
#
# Render reads this file and provisions the service, so the dashboard
# steps are reduced to: New -> Blueprint -> pick this repository ->
# fill in the values it asks for -> Apply.
#
# Everything here is free, and the data survives.
#
#   • the API runs on Render's free web service
#   • the database is a free hosted Postgres — Supabase or Neon, set
#     through DATABASE_URL below
#
# That second line is the whole point. A free Render service has no
# persistent disk, so a database kept in a file inside the container
# would be wiped on every deploy, every restart and every wake from
# sleep. Postgres lives somewhere else and does not care what Render
# does to the container.
#
# The one free-tier cost left is sleep: a free service naps after about
# 15 minutes without traffic, so the first request afterwards takes the
# best part of a minute and the live Socket.IO link drops until a
# reload. Orders and money are safe; the cashier's screen just needs a
# refresh after a quiet spell. A paid instance removes that.

services:
  - type: web
    name: alhadeed-api
    runtime: node
    plan: free
    region: frankfurt # the closest Render region to Uganda
    rootDir: backend
    buildCommand: npm install
    # Bootstrap first: it creates the tables on an empty database and
    # exits non-zero rather than starting a shop nobody can sign in to.
    # It is safe to repeat and does nothing once the shop has data.
    startCommand: npm run db:bootstrap && npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ─── The database ─────────────────────────────────────────────
      # A free Postgres from Supabase (Project settings -> Database ->
      # Connection string -> URI) or Neon. Use the pooled/session
      # connection string, not the direct one, so the free connection
      # limit is not exhausted. Looks like:
      #   postgresql://user:password@host:5432/postgres
      - key: DATABASE_URL
        sync: false

      # ─── Runtime ──────────────────────────────────────────────────
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production

      # ─── Security ─────────────────────────────────────────────────
      # Render generates this once and keeps it. Never commit a real
      # one: anyone holding it can mint a valid login for any account.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h

      # Left true, every login code is 123456 for anyone who knows a
      # registered number.
      - key: OTP_DEV_MODE
        value: "false"

      # ─── The shop ─────────────────────────────────────────────────
      - key: SHOP_NAME
        value: Al Hadeed Hardware
      - key: CURRENCY
        value: UGX

      # ─── Who can call the API ─────────────────────────────────────
      # The Vercel domain, e.g. https://alhaheed-hardware.vercel.app —
      # comma-separated for more than one. Until it is right, the
      # browser blocks every request from the panel.
      - key: CORS_ORIGINS
        sync: false

      # ─── The first manager ────────────────────────────────────────
      # Used once, on an empty database, to create the account that adds
      # the real staff and products. Delete ADMIN_PASSWORD afterwards;
      # it is never read again once a staff account exists.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ─── SMS ──────────────────────────────────────────────────────
      # "log" writes the message to the service log and sends nothing,
      # so it costs nothing: fine for testing, useless to a customer
      # waiting for a code. Switch to africastalking and fill in the
      # three values below when you are ready to pay per message.
      - key: SMS_PROVIDER
        value: log
      - key: SMS_USERNAME
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
