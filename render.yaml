# Al Hadeed Hardware — the API and its database, as a Render Blueprint.
#
# Render reads this file and provisions both, so the dashboard steps are
# reduced to: New -> Blueprint -> pick this repository -> fill in the
# values it asks for -> Apply.
#
# PostgreSQL, created by Render, in the same dashboard as the API. No
# second account anywhere, and the connection string is injected into
# the service rather than copied by hand.
#
# Why a database and not a file on disk: a free Render service has no
# persistent disk, so a SQLite file inside the container would be wiped
# on every deploy, every restart and every wake from sleep. The database
# is a separate thing that survives all of it.
#
# ── TWO THINGS ABOUT THE FREE TIER ───────────────────────────────────
#
#  1. Render's free PostgreSQL expires. At the time of writing it runs
#     for a limited period and is then deleted, and their current terms
#     are the thing to check — not this comment. When it expires the
#     shop loses its data, so before that day either upgrade the
#     database to a paid instance or take a dump and move it. Any
#     ordinary PostgreSQL works: change DATABASE_URL and nothing else.
#
#  2. The free web service sleeps after about 15 minutes without
#     traffic. The first request afterwards takes the best part of a
#     minute, and the live Socket.IO link drops until a reload, so the
#     cashier's screen needs a refresh after a quiet spell. Orders and
#     money are safe either way.
#
# Keeping a backup is one command, and worth putting in the calendar:
#   pg_dump $DATABASE_URL > alhadeed-$(date +%F).sql

databases:
  - name: alhadeed-db
    databaseName: alhadeed
    user: alhadeed
    plan: free
    region: frankfurt # the closest Render region to Uganda

services:
  - type: web
    name: alhadeed-api
    runtime: node
    plan: free
    region: frankfurt # the closest Render region to Uganda
    rootDir: backend
    buildCommand: npm install
    # Bootstrap first: it creates the tables on an empty database and
    # exits non-zero rather than starting a shop nobody can sign in to.
    # It is safe to repeat and does nothing once the shop has data.
    startCommand: npm run db:bootstrap && npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ─── The database ─────────────────────────────────────────────
      # Render creates the PostgreSQL below and puts its connection
      # string here. Nothing to copy, nothing to paste, no second
      # account anywhere.
      - key: DATABASE_URL
        fromDatabase:
          name: alhadeed-db
          property: connectionString

      # ─── Runtime ──────────────────────────────────────────────────
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production

      # ─── Security ─────────────────────────────────────────────────
      # Render generates this once and keeps it. Never commit a real
      # one: anyone holding it can mint a valid login for any account.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h

      # Left true, every login code is 123456 for anyone who knows a
      # registered number.
      - key: OTP_DEV_MODE
        value: "false"

      # ─── The shop ─────────────────────────────────────────────────
      - key: SHOP_NAME
        value: Al Hadeed Hardware
      - key: CURRENCY
        value: UGX

      # ─── Who can call the API ─────────────────────────────────────
      # The Vercel domain, e.g. https://alhaheed-hardware.vercel.app —
      # comma-separated for more than one. Until it is right, the
      # browser blocks every request from the panel.
      - key: CORS_ORIGINS
        sync: false

      # ─── The first manager ────────────────────────────────────────
      # Used once, on an empty database, to create the account that adds
      # the real staff and products. Delete ADMIN_PASSWORD afterwards;
      # it is never read again once a staff account exists.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ─── SMS ──────────────────────────────────────────────────────
      # "log" writes the message to the service log and sends nothing,
      # so it costs nothing: fine for testing, useless to a customer
      # waiting for a code. Switch to africastalking and fill in the
      # three values below when you are ready to pay per message.
      - key: SMS_PROVIDER
        value: log
      - key: SMS_USERNAME
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
