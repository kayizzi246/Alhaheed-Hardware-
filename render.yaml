# Al Hadeed Hardware — the API, as a Render Blueprint.
#
# Render reads this file and provisions the service, so the dashboard
# steps are reduced to: New -> Blueprint -> pick this repository ->
# fill in the values it asks for -> Apply.
#
# ── WHY THE DATABASE IS NOT DECLARED HERE ────────────────────────────
#
# Render's free PostgreSQL expires about a month after it is created and
# is then deleted. That is a deadline, not a free tier, and it is not a
# thing to hang a shop's order history on.
#
# Render's free *web service* has no such expiry, so the API stays here
# and the database goes somewhere permanently free. Point DATABASE_URL
# at ordinary PostgreSQL from whichever you prefer — the connection
# string is the only thing this application knows about it:
#
#   Neon   https://neon.com   free, no expiry, sleeps when idle and
#                             wakes in well under a second
#   Aiven  https://aiven.io   free, no expiry, no card asked for
#
# Check their current terms before committing. Free tiers move, and the
# comment you are reading cannot.
#
# To keep the data in the shop instead of on someone's cloud, run
# PostgreSQL on a machine at the counter and point DATABASE_URL at it.
# docs/DEPLOYMENT.md has that route: free forever, no expiry to diarise.
#
# ── THE ONE REMAINING FREE-TIER CATCH ────────────────────────────────
#
# A free Render web service sleeps after about 15 minutes without
# traffic. The first request afterwards takes the best part of a minute,
# and the live Socket.IO link drops until a reload, so the cashier's
# screen needs a refresh after a quiet spell. Orders and money are safe
# either way. A paid instance removes it.
#
# Back the database up on a schedule regardless:
#   pg_dump "$DATABASE_URL" > alhadeed-$(date +%F).sql

services:
  - type: web
    name: alhadeed-api
    runtime: node
    plan: free
    region: frankfurt # the closest Render region to Uganda
    rootDir: backend
    buildCommand: npm install
    # Bootstrap first: it creates the tables on an empty database and
    # exits non-zero rather than starting a shop nobody can sign in to.
    # It is safe to repeat and does nothing once the shop has data.
    startCommand: npm run db:bootstrap && npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ─── The database ─────────────────────────────────────────────
      # The connection string from Neon, Aiven, or your own PostgreSQL.
      # Looks like:
      #   postgresql://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ─── Runtime ──────────────────────────────────────────────────
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production

      # ─── Security ─────────────────────────────────────────────────
      # Render generates this once and keeps it. Never commit a real
      # one: anyone holding it can mint a valid login for any account.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h

      # Left true, every login code is 123456 for anyone who knows a
      # registered number.
      - key: OTP_DEV_MODE
        value: "false"

      # ─── The shop ─────────────────────────────────────────────────
      - key: SHOP_NAME
        value: Al Hadeed Hardware
      - key: CURRENCY
        value: UGX

      # ─── Who can call the API ─────────────────────────────────────
      # The Vercel domain, e.g. https://alhaheed-hardware.vercel.app —
      # comma-separated for more than one. Until it is right, the
      # browser blocks every request from the panel.
      - key: CORS_ORIGINS
        sync: false

      # ─── The first manager ────────────────────────────────────────
      # Used once, on an empty database, to create the account that adds
      # the real staff and products. Delete ADMIN_PASSWORD afterwards;
      # it is never read again once a staff account exists.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ─── SMS ──────────────────────────────────────────────────────
      # "log" writes the message to the service log and sends nothing,
      # so it costs nothing: fine for testing, useless to a customer
      # waiting for a code. Switch to africastalking and fill in the
      # three values below when you are ready to pay per message.
      - key: SMS_PROVIDER
        value: log
      - key: SMS_USERNAME
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
